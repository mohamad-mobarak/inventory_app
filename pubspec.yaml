name: inventory_app
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fl_chart: ^1.1.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  provider: ^6.1.5
  hive_ce: ^2.20.2
  hive_ce_flutter: ^2.3.4
  intl: ^0.20.2
  google_sign_in: ^7.2.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4


flutter:

  uses-material-design: true
  # Register the assets folder
  assets:
  # Include all files inside assets/images
      - assets/images/
  # assets:
  #  - images/a_dot_burr.jpeg
  #  - images/a_dot_ham.jpeg
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

  # Configures how the app icons are generated
flutter_launcher_icons:
  # Uses the same logo for every icon
  image_path: "assets/images/app_logo.png"
  # Replaces the Android launcher icon
  android: true
  # Skips iOS, because the app targets Android and web only
  ios: false
  # Generates the website icons and the browser tab icon
  web:
    generate: true
    image_path: "assets/images/app_logo.png"
    background_color: "#0F766E"
    theme_color: "#0F766E"
